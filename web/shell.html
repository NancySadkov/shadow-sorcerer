<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Sorcerer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
    background: #000;
    outline: none;
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="canvas" width="960" height="600" tabindex="0"></canvas>
<script>
  /* The game draws its own pointer and uses right-click; keep the browser's
     context menu out of the way. */
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
